<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="styles.css" />
	<title>Order Form</title>
</head>

<body>
	<form action="#" method="post">
		<fieldset>
			<legend>Your Details</legend>
			<ol>
				<li>
					<label for="name">Name</label>
					<input type="text" id="name" name="name" autofocus />
				</li>
				<li>
					<label for="email">Email</label>
					<input type="email" id="email" name="email" />
				</li>
				<li>
					<label for="phone">Phone</label>
					<input type="tel" id="phone" name="phone" />
				</li>
			</ol>

			<legend>Delivery Address</legend>
			<ol>
				<li>
					<label for="address">Address</label>
					<textarea name="address" id="address">Address</textarea>
				</li>
				<li>
					<label for="postalcode">Postal Code</label>
					<input type="text" id="postalcode" name="postalcode" placeholder="E.g. R5G 1F8" />
				</li>
				<li>
					<label for="country">Country</label>
					<select name="country" id="country">
						<option value="CA">Canada</option>
						<option value="UK">United Kingdom</option>
						<option value="PA">Paraguay</option>
				</li>
			</ol>
		</fieldset>
		<fieldset>
			<legend>Card Details</legend>
			<ol>
				<li>
					<fieldset>
						<legend>Card Type</legend>
						<ol>
							<li>
								<input type="radio" id="visa" name="cardtype" />
								<label for="visa">Visa</label>
							</li>
							<li>
								<input type="radio" id="mastercard" name="cardtype" />
								<label for="mastercard">MasterCard</label>
							</li>
							<li>
								<input type="radio" id="amex" name="cardtype" />
								<label for="amex">AmEx</label>
							</li>
						</ol>
					</fieldset>
				</li>
				<li>
					<label for="cardnumber">Card Number</label>
					<input type="number" id="cardnumber" name="cardnumber" />
				</li>
				<li>
					<label for="secure">Security Code</label>
					<input type="password" id="secure" name="secure" />
				</li>
				<li>
					<label for="namecard">Name on Card</label>
					<input type="text" id="namecard" name="namecard" />
				</li>
			</ol>
		</fieldset>
		<fieldset>
			<button type="submit">Buy it!</button>
		</fieldset>
	</form>
</body>

</html>
