<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winnipeg Cycling Network</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>Winnipeg Cycling Network</h1>
    </header>

    <main>
        <section>
            <h2>Discover a Random Cycling Route</h2>


            <button id="routeButton" type="button">
                Click for route
            </button>
        </section>

        <section id="routeSection" aria-label="Random cycling route">
            <div id="Container" aria-live="polite">
                <article class="route-card">
                    <h2 id="routeName">Route Below</h2>

                    <p>
                        Infrastructure Type:
                        <span id="routeType"></span>
                    </p>

                    <p>
                        Road Location:
                        <span id="roadLocation"></span>
                    </p>

                    <p>
                        Length:
                        <span id="routeLength"></span>
                    </p>

                    <p>
                        Two-Way Travel:
                        <span id="twoWayTravel"></span>
                    </p>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <p>
            Data from the City of Winnipeg
        </p>
    </footer>
</body>

</html>
