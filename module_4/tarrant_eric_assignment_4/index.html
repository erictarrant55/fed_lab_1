<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winnipeg Cycling Network</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>Winnipeg Cycling Network</h1>
    </header>

    <main>
        <section>
            <h2>Search Cycling Routes</h2>

            <div class="search">
                <label for="searchInput">Search by route name</label>
                <input type="text" id="searchInput" placeholder="e.g. Charleswood">
                <button id="searchButton" type="button">Search</button>
            </div>
        </section>

        <section aria-label="Search results">
            <p id="message" role="status"></p>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Name</th>
                            <th scope="col">Type</th>
                            <th scope="col">Location</th>
                            <th scope="col">Length</th>
                            <th scope="col">Two-way</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody"></tbody>
                </table>
            </div>
        </section>

        <template id="rowTemplate">
            <tr>
                <td data-field="infrastructure_name"></td>
                <td data-field="infrastructure_type"></td>
                <td data-field="road_location"></td>
                <td data-field="length"></td>
                <td data-field="two_way_travel"></td>
            </tr>
        </template>
    </main>

    <footer>
        <p>
            Data from the City of Winnipeg
        </p>
    </footer>
</body>

</html>
