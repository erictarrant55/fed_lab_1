<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dystopian World - Adventure Game</title>

    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <main id="game-container">

        <header>
            <h1>Dystopian World</h1>

            <p id="progress" aria-live="polite">
                Your adventure begins...
            </p>
        </header>

        <section id="question-container">

            <h2 id="question"></h2>

        </section>

        <section id="story">

            <section id="answers" aria-label="Adventure choices">
                <!-- Answer buttons will be injected here by JavaScript -->
            </section>

            <section id="controls">

                <button id="restart-btn" type="button">
                    Restart Adventure
                </button>

            </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
